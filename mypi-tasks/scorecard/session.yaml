# scorecard: implement GitHub issue #14 — derive a per-run health scorecard at finalize.
# Part of spec #13 / epic #10. Execution mode on the ticket: mypi task run
# (foundation of the loop + the derived-only privacy invariant need an independent attester).
#
# Authored here; `just prep scorecard` copies it into the worktree on branch
# task/scorecard. Roster patterned on .mypi/jev-c2-gate/session.yaml.

version: "1.2"

session:
  id: "scorecard"
  max_cost_usd: 6.00                  # peer ceiling; supervisor spend is additive
  agent_stop_threshold_percent: 95
  attester: "reviewer"
  stop_at_work_order_boundary: true
  verify_models: strict
  peer_prompt_timeout_ms: 420000
  peer_retry_pause_ms: 30000
  peer_max_retries: 3
  stall_timeout_ms: 300000
  supervisor_model: "deepseek/deepseek-flash"
  shell_vocabulary:
    - "bun run test"
    - "bun run typecheck"
    - "bunx biome check ."
    - "git status"
    - "git diff --stat"
    - "git log --oneline -5"
  supervisor_system_prompt: |
    You drive the implementation of GitHub issue #14 in this worktree. You own the
    run contract and plan.md — not the source files. Read the ticket with
    `gh issue view 14`; the parent spec is `gh issue view 13`.

    The one invariant that must not be violated: the scorecard records DERIVED
    METRICS ONLY — never prompts, code, transcripts, or system prompts. Treat that
    as the central acceptance criterion, not an afterthought.

    Stay on branch task/scorecard. Do not implement #18 (classification), #19
    (corpus/aggregator), #15/#16/#17, or anything in the spec's Out of Scope.

ask:
  title: "Implement issue #14: per-run health scorecard at finalize"
  description: >-
    Implement GitHub issue #14 (part of spec #13): a pure
    buildScorecard(artifacts, config) -> RunScorecard, a session.record_scorecard
    boolean (default false), and a finalize hook that writes run-details/scorecard.json.
    Derived metrics only. Full ticket: `gh issue view 14`.
  definition_of_done:
    - "buildScorecard is pure and fixture-tested (clean run, timeout-heavy run, false-success run)."
    - "session.record_scorecard defaults to false and its validation is covered."
    - "On finalize with the flag on, run-details/scorecard.json is written and parses."
    - "The scorecard carries a taxonomy version."
    - "A boundary test asserts no prompt/code/transcript field can reach the scorecard."

agents:
  - id: "implementer"
    title: "Implementer"
    model: "deepseek/deepseek-v4-pro"
    permissions:
      read: true
      edit: true
      shell: true
    max_cost_usd: 3.00
    system_prompt: >-
      Read the ticket first (`gh issue view 14`). Build it test-first. You own the
      scorecard module, the session-schema flag, and the finalize hook. Record
      file:line for every change. Do not touch the corpus/aggregator (#19) or the
      resume path (#17).

  - id: "verifier"
    title: "Verifier"
    model: "deepseek/deepseek-flash"
    permissions:
      read: true
      edit: false
      shell: true
    max_cost_usd: 1.50
    system_prompt: >-
      READ ONLY. Run `bun run test`, `bun run typecheck`, and `bunx biome check .`
      yourself and paste raw output. Confirm the flag defaults to false and that a
      recorded scorecard contains no prompt/code/transcript field. Report an explicit
      line beginning `TEST_VERIFIER FINAL:` followed by GREEN or RED. Never claim a
      run you did not execute.

  - id: "reviewer"
    title: "Reviewer / Attester"
    model: "fireworks/accounts/fireworks/models/glm-5p3"
    permissions:
      read: true
      edit: false
      shell: true
    max_cost_usd: 1.50
    system_prompt: >-
      READ ONLY. Attest each DoD criterion verbatim with the raw output you ran
      yourself. Independently try to find any path by which a prompt, code, or
      transcript field can reach the scorecard, and report one that exists. End with
      a fenced JSON array holding exactly one
      {"criterion","result","pass"|"fail","evidence"} per criterion, in config order.

validation:
  commands:
    - "bun run test"
    - "bun run typecheck"
    - "bunx biome check ."
