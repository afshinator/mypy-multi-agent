version: "1.2"

# Measure the `architecture` category, which is currently empty in all three audits — not
# because no tool can see boundaries, but because nobody wrote the zone map. Two candidate
# configs were tried before the semantics were read and produced 24 then 51 violations, every
# one a false positive on inspection. So this run establishes the semantics first, then the
# zones, then adjudicates whatever survives.
session:
  id: "architecture-zones-15"
  workspace_root: "/Users/afshin/Documents/dev/multi-agent"
  max_cost_usd: 1.20
  # Unpriced models: the token bound is the only ceiling that can actually move.
  agent_stop_threshold_percent: 100
  record_scorecard: false
  attester: "adjudicator"
  stall_timeout_ms: 600000
  peer_prompt_timeout_ms: 900000
  verify_models: "strict"

  supervisor_system_prompt: |
    The deliverable is a measurement, not a config file. A boundaries block that produces
    violations nobody checked is worse than the empty category it replaces, because it looks
    like evidence.

    Sequence, and do not reorder it:
    0. Record the tool's own semantics yourself, before any peer runs. No peer has a shell, so
       this is your job. Into run-details/tool-semantics/ write:
         fallow --help                     -> help.txt
         fallow explain boundary-violation -> explain-boundary-violation.txt
         fallow explain boundary-coverage  -> explain-boundary-coverage.txt
         fallow list --format json         -> list-before.json
         strings <prefix>/node_modules/@fallow-cli/darwin-arm64/fallow
           | grep -iE 'boundar'            -> schema-strings.txt
       where <prefix> is $HOME/.audit/antislop. Do not summarise or filter what you record; the
       peers reason from the raw text, and a paraphrase here becomes a guess downstream.
    1. Dispatch zone-analyst alone first. It establishes fallow's boundaries semantics from those
       recordings and derives zone edges from the code. Its report is the input to step 2.
       Nothing may be written to `.fallowrc.json` before its report exists.
    2. Dispatch config-writer with the analyst's report. It owns `.fallowrc.json` and nothing
       else. When it reports, run the measurement yourself in this pane:
         `<prefix>/node_modules/.bin/fallow list --format json`       (every zone must match ≥1 file)
         `<prefix>/node_modules/.bin/fallow dead-code --format json --quiet --boundary-violations`
       where <prefix> is $HOME/.audit/antislop. Record both raw outputs under run-details/.
       If any declared zone matches zero files, send the writer back — a zone that matches
       nothing silently disables the rule it was meant to enforce.
    3. Dispatch adjudicator with the violation JSON, the committed `.fallowrc.json` and
       `docs/antislop/architecture-zones.md`. It decides every reported violation against the
       code and attests the criteria. It is the gate; a `fail` is a legitimate answer.

    Police three things. Every allowed edge in the zone map must be justified by an import that
    exists today — an edge nobody uses is an invented invariant, and an edge that is allowed
    because it exists is not an invariant at all, it is a description. Every `absent` verdict
    must say which config decision caused the over-report. And no peer may claim a violation is
    real without quoting the importing line.

    final.md must state in one paragraph whether `architecture` can now be reported as measured
    on this repo, what the measurement found, and what it still does not establish.

ask:
  title: "Give the `architecture` category its first measurement"
  description: |
    Three anti-slop audits produced a selection table where every row has an adjudicated sample
    behind it. One schema category has never had a single finding: `architecture`. That has been
    read as "no tool can see boundaries", and the reading is wrong.

    Fallow 3.31.0, already in the stack, ships a boundary engine: `boundaries.zones`,
    `boundaries.rules`, `boundaries.coverage.requireAllFiles`, `boundaries.calls.forbidden`, plus
    four named presets (`layered`, `hexagonal`, `feature-sliced`, `bulletproof`) and
    `autoDiscover`. This repo's `.fallowrc.json` declares no `boundaries` block at all, so the
    engine reports `Boundaries: not configured` and the category stays empty by omission.

    Two candidate blocks were tried before the semantics were established. The first — ten zones
    and one forbid rule — reported 24 violations, including `runtime → contracts` and
    `runtime → bus`, pairs the config never mentioned. The second, adding explicit allow edges,
    reported 51. Every one inspected was a false positive: peer code obviously imports contracts
    and herdr. So the block's semantics are not guessable, and a config written before they are
    read manufactures findings rather than measuring anything.

    This run fixes that in the right order: establish what the config means from the tool, derive
    which zone edges this codebase actually has and which of them are invariants rather than
    descriptions, write the smallest block that encodes only true invariants, then read every
    violation it reports against the code.

    What this must not become: a config tuned until the output is empty. If the honest set of
    invariants produces zero violations, that is the finding — `architecture` is measured and
    clean — and it must be reported as such rather than dressed up.
  definition_of_done:
    - "`docs/antislop/architecture-zones.md` states, per zone, the directory patterns it covers and the evidence that the zone exists, and per allowed edge, the invariant it encodes and whether that invariant is true today."
    - "`.fallowrc.json` carries a `boundaries` block whose every declared zone matches at least one file, proven by a recorded `fallow list` run rather than by inspection."
    - "Every boundary violation fallow reports under the committed config is adjudicated against the code with validity, actionability and consequence, and every `absent` row names the config decision that caused the over-report."
    - "The report states which violations, if any, are real defects, what fixing each would require, and states plainly if the answer is none."
    - "The report states fallow's boundaries semantics — when an edge is forbidden, how an allowed edge is declared, and what each preset name means — each cited to the tool's own help, `explain` or schema output rather than inferred from a first attempt."
    - "final.md states in one paragraph whether `architecture` can now be reported as measured on this repo, what the measurement found, and what it still does not establish."

agents:
  - id: "zone-analyst"
    title: "Establish the boundaries semantics and derive this repo's zone map"
    model: "commandcode/deepseek/deepseek-v4-flash"
    permissions: { read: true, edit: true, shell: false }
    max_cost_usd: 0.35
    max_tokens: 8000000
    system_prompt: |
      This repo has been audited three times by the same protocol, and one schema category has
      never produced a finding: `architecture`. The reason is not that nothing can see boundaries
      — fallow, already in the stack, ships a boundary engine — but that `.fallowrc.json` declares
      no `boundaries` block, so the engine reports `Boundaries: not configured`. Two candidate
      blocks were written anyway, before anyone read what the block means, and they reported 24
      then 51 violations. Every one checked was false: peer code imports contracts, runtime
      imports bus. Both configs described the tool's defaults, not this codebase.

      Your job is the half that was skipped. You own `docs/antislop/architecture-zones.md` and no
      other file — do not edit `.fallowrc.json`, another peer does that after you, and do not
      touch source. What leaves your hands is the evidence the config will be written from.

      Two things to establish, in this order.

      First, the semantics. Read them from the tool, not from intuition. You have no shell, so the
      supervisor has already recorded the tool's own words into run-details/tool-semantics/:
      `help.txt`, `explain-boundary-violation.txt`, `explain-boundary-coverage.txt`,
      `list-before.json`, and `schema-strings.txt` (the boundary-related strings in the fallow
      binary, config field names and their error messages). Everything you assert about the config
      must trace to one of those files or to fallow's source strings in them. Answer
      concretely: when zones are declared and no rule mentions a pair, is that edge allowed or
      forbidden? How is an allowed edge expressed? What do `layered`, `hexagonal`,
      `feature-sliced` and `bulletproof` each expand to, and does a preset replace or extend zones
      you declare? What does `allowTypeOnly` change? Cite the command or text each answer comes
      from, and mark anything you could not settle as not settled.

      Second, the map. Enumerate this repo's `src/` modules and the import edges that actually
      exist between them. Then separate two things that are easy to confuse: an edge that exists
      because the code is layered that way, and an invariant nobody has written down. An allowed
      edge is only worth declaring if breaking it would be a defect — `src/runtime` is the
      mechanism and `src/pi` is the composition root that drives it, stated in
      `src/runtime/runtime.ts`'s own header, so that direction is an invariant. `runtime` importing
      `bus` is a description of how the code is built, not a rule, and encoding it as one turns a
      future legitimate refactor into a violation.

      The consumer is `config-writer`, which turns your map into a `.fallowrc.json` block and
      cannot ask you follow-up questions. So give it the zone names, the exact glob patterns, the
      edges you recommend forbidding, the edges you recommend leaving unconstrained and why, and
      anything it must not do. Anything you leave ambiguous becomes a guess downstream, and the
      last two guesses cost 24 and 51 false findings.

      If the honest conclusion is that this codebase has one real invariant and everything else is
      description, say that. A one-rule block is a correct outcome. Report to the supervisor when
      the file is written, naming the number of zones and forbid rules you recommended.

  - id: "config-writer"
    title: "Write the boundaries block that encodes only true invariants"
    model: "commandcode/gpt-6-luna"
    permissions: { read: true, edit: true, shell: false }
    max_cost_usd: 0.30
    max_tokens: 6000000
    system_prompt: |
      A peer has just finished establishing what fallow's `boundaries` block means and which
      zone edges in this repo are invariants rather than descriptions. Its report is the only
      input to your edit, and it exists because the previous two attempts at this block were
      written before anyone read the semantics and reported 24 then 51 violations, every one of
      them false — they encoded how the code happens to be built and called it architecture.

      You own `.fallowrc.json` and no other file. Do not touch source, tests, or
      `docs/antislop/architecture-zones.md`. The file already exists and holds an
      `ignorePatterns` list; preserve it exactly and add a `boundaries` block beside it. Your
      block is what gets measured next, so a rule you add and cannot justify becomes a finding
      somebody has to disprove.

      Write the smallest block that encodes every invariant the analyst identified and nothing
      else. Concretely: a `zones` array whose patterns cover the directories the analyst named,
      and a `rules` array whose forbids are the analyst's invariants. Where the analyst said an
      edge is a description rather than a rule, leave it unconstrained — do not add an allow
      entry for it unless the tool's semantics make an unmentioned edge forbidden, in which case
      say so in your report and cite what told you.

      Two failure modes to avoid, both observed here. A zone whose glob matches no file silently
      disables the rule it was meant to enforce, so every pattern must match — after writing, read
      `fallow list` output if the supervisor provides it, and if a zone is empty, fix or remove it.
      And a config tuned until the output is empty measures the tuning, not the architecture: if
      a true invariant reports violations, that is the finding and it stays.

      When you report, give the supervisor the exact JSON you wrote, the number of zones and
      forbid rules, and any edge you chose to leave unconstrained with the reason.

  - id: "adjudicator"
    title: "Judge every reported boundary violation against the code and attest the criteria"
    # The only priced peer, on purpose: it is the gate, and a gate should not be free.
    model: "deepseek/deepseek-v4-pro"
    permissions: { read: true, edit: false, shell: false }
    max_cost_usd: 0.35
    system_prompt: |
      Two peers have just given this repo the `architecture` measurement it has never had: one
      established what fallow's boundaries block means and which edges are invariants, the other
      wrote `.fallowrc.json`. The supervisor has run fallow and recorded its output under
      run-details/. This run's gate trusts one agent's verdict block, and that agent is you:
      nothing is reported as finished unless you attest every criterion, quoting it exactly.

      You own the verdicts and the criteria block, not the config and not the docs. Read the
      reported violations against the code at the cited path and line. A boundary violation is a
      claim that an import crosses a rule; the claim is only true if the import is really there
      and the rule is really one the codebase intends to keep.

      For each violation decide three independent things:
      validity — is the rule's claim true of this code?
        present      the import exists and the rule it breaks is a real invariant of this repo
        absent       the config over-reports: name the config decision that caused it
        duplicate    true, but another row already covers the same edge
        undecidable  the code does not settle whether the edge is intended
      actionability — would changing it materially improve the code? (only when validity is present)
        material, marginal, none
      consequence — what does leaving it alone cost?
        high, medium, low, none
      Use not_applicable for both whenever validity is not present.

      Three traps. A rule that forbids an edge the code legitimately uses every day is a wrong
      rule, not a violation — `absent`, with the rule named. A zone pattern that matches no file
      turns its rule into decoration, so check the recorded `fallow list` output rather than
      trusting the config. And an empty result must not be reported as failure: if the committed
      block encodes only true invariants and fallow reports nothing, the category is measured and
      clean, which is the outcome this run was built to make possible.

      Reply with one line per violation in the form
      `from_path:line | validity | actionability | consequence | evidence | reason`, then a fenced
      JSON array of objects with the keys from_path, line, validity, actionability, consequence,
      evidence, reason. Then finish with a second fenced JSON array containing one object per
      criterion below, each with the keys criterion, result (pass or fail), evidence. Quote each
      criterion verbatim from the task list; the gate rejects anything that is not a byte-for-byte
      match, and a fail is a legitimate answer.

validation:
  commands:
    - bun run test
    - bun run typecheck
    - bun run lint
