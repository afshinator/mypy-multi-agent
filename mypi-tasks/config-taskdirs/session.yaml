# Spec #55 / tickets #56–#60: replace the hardcoded `.mypi` task dir with a
# config-driven, ordered `taskDirs` list (root `mypi-multi-agent.yaml`), add an
# explicit `/mypi-multi-agent --init` scaffolder, and make the run command a pure
# read. Cross-cutting single-writer change: shared/ + src/pi/{session-path,
# scaffold,extension} + templates/ + docs + a new config file for this repo.
# Test-first, read-only verifier on the gates, read-only reviewer attesting DoD.
#
# Learnings baked in: verifier runs gates ONLY after the implementer reports a
# code change (no baseline run); reviewer reproduces DoD byte-for-byte; ponytail
# reconciliation required from every peer.
#
# Mid-stride safety: this run's own session lives in `.mypi/config-taskdirs/`.
# The repo config added mid-run MUST list `.mypi` as a later entry so this run
# never orphans itself. We do NOT migrate or delete `.mypi/`.

version: "1.2"

session:
  id: "config-taskdirs"
  max_cost_usd: 5.10 # PEER ceiling; supervisor spend is additive
  agent_stop_threshold_percent: 95 # room for one reviewer-driven fix round
  attester: "reviewer"
  stop_at_work_order_boundary: true # never cut the implementer mid-edit
  verify_models: strict # abort before spawn if a slug mis-resolves
  peer_prompt_timeout_ms: 900000 # a full suite turn is long
  peer_max_retries: 3
  supervisor_model: "deepseek/deepseek-v4-pro"
  supervisor_system_prompt: |
    You drive a cross-cutting, test-first change: replace the hardcoded `.mypi`
    task directory with a config-driven ordered `taskDirs` list, add the
    `/mypi-multi-agent --init` scaffolder, and make the run command a pure read.
    ONE implementer owns the whole change — do NOT fan it out to parallel
    editors; shared/, src/pi/, templates/, docs, and the new repo config file are
    not disjoint, and single-writer is the rule.

    Loop:
      1. Have the implementer read spec #55 and tickets #56–#60 (the acceptance
         criteria). Tickets must land in dependency order: #56 parser, #57
         resolution + this repo's config, #58 --init, #59 no-auto-scaffold, #60
         docs. Same commit set; do not let one ticket's half-state sit green-less.
      2. Require test-first: the existing session-path/scaffold/extension tests
         are the characterization harness. Where behavior changes, write the
         failing test first (paste the failure) before the implementation. Never
         weaken an existing behavior assertion.
      3. When the implementer reports, have the test_verifier run the full suite
         and the gates with shell:true and report an explicit GREEN or RED with
         the exact numbers.

    Sequencing (non-negotiable): the implementer produces a code change FIRST.
    Never dispatch the test_verifier or the reviewer before the implementer has
    reported code written — no baseline gate run. The verifier and reviewer are
    dispatched only after the implementer's report, in the Gate order below.

    Gate, in this order (do not reorder):
      1. test_verifier runs `bun run test`, `bun run typecheck`, `biome check .`,
         `fallow dead-code`, `fallow health` and reports GREEN/RED plus the exact
         counts. RED = suite failure, typecheck error, biome error, a new stale
         suppression, more than 6 dead-code issues, or a fallow health score
         below 77 B.
      2. Only after GREEN, the reviewer reads the actual code and attests each
         DoD criterion verbatim (fenced JSON array), citing function/symbol
         names — never line numbers. A missing or failed criterion fails the run.
      3. validation.commands must also pass mechanically.

    MID-STRIDE SAFETY (non-negotiable): this run's own session lives in
    `.mypi/config-taskdirs/`. The repo config the implementer writes MUST be
    `taskDirs: [mypi-tasks, .mypi]` so this run stays resolvable via the legacy
    entry. The implementer MUST NOT migrate, rename, or delete `.mypi/`. The DoD
    carries an explicit self-check criterion for this.

    Budget and failure handling: the implementer has the bulk of the budget; do
    not strand it. An empty peer reply is a transient fault — retry, then
    restart_agent on a different workable model. Never absorb the implementer's
    work into the supervisor.

    QUALITY
      PONYTAIL (load the skill, do not paraphrase it). Every peer loads the
      `ponytail` skill at level `full`: smallest complete change, no unrequested
      abstraction, deletion over addition, the codebase's own conventions. Never
      cut validation at a trust boundary or error handling that prevents data
      loss. A shortcut with a known limit carries `shortcut: <limit>, <when to
      upgrade>`. The reviewer reconciles every decision against that ladder and
      RETURNS it: what was built, what was deliberately NOT built, every shortcut
      limit with its trigger.
      LINT/FORMAT. The reviewer attests the biome/fallow numbers from the
      verifier's reported output; a new biome error, a new stale suppression, or
      a fallow regression from baseline is blocking. Never claim a command you
      did not run.

ask:
  title: "Config-driven task directories (spec #55, tickets #56–#60)"
  description: >-
    Replace the hardcoded `.mypi` task directory with a config-driven ordered
    `taskDirs` list declared in a root `mypi-multi-agent.yaml` (spec #55). Build
    a pure `parseMultiAgentConfig(text) -> { version, taskDirs }` in `shared/`
    (zero node:/bun imports), rejecting unknown `version`, empty `taskDirs`, and
    malformed YAML (#56). Make `resolveSessionPath` walk `taskDirs` in order —
    named lookup stops at first match, unnamed lookup walks all and de-duplicates
    first-wins — removing the `.mypi` hardcode and the "one level of
    subdirectories" scan, and erroring "project not configured to run
    mypi-multi-agent" when no config exists; add this repo's
    `mypi-multi-agent.yaml` with `taskDirs: [mypi-tasks, .mypi]` so existing
    `.mypi/` runs stay resolvable (#57). Add `/mypi-multi-agent --init`: creates
    the config when absent (default `taskDirs: [mypi-tasks]` plus a comment
    stating the first-entry-writes rule), reports "already configured" without
    overwriting when present, and drops a keys-only starter
    `<taskDirs[0]>/task/session.yaml` whose fields carry no values and whose
    comments explain each key (#58). Make the run command never scaffold: no
    config -> "project not configured to run mypi-multi-agent — run
    `/mypi-multi-agent --init`", missing task -> "task '<name>' not found under
    taskDirs"; remove the auto-scaffold path (#59). Update the live docs:
    GLOSSARY.md ("Task", "Project root"), README.md, docs/agent-config-guide.md
    §7, docs/architecture-handoff.md, and the "`.mypi` corpus" mentions in
    docs/pi-durable-fit.md and docs/landscape-and-positioning.md; leave historical
    snapshots untouched (#60). No `.mypi` or `mypi-tasks` literal may appear as a
    task-dir constant in the read/write code paths.
  definition_of_done:
    - "A pure `parseMultiAgentConfig(text) -> { version, taskDirs }` lives in `shared/` with zero `node:`/bun imports, and rejects an unknown `version`, an empty `taskDirs`, and malformed YAML."
    - "`grep -rE \"from \\\"(node:|bun:)\" shared/` returns nothing."
    - "`resolveSessionPath` walks the config's `taskDirs` in order — a named lookup stops at the first match, an unnamed lookup walks all entries and de-duplicates name collisions first-wins — with no `.mypi` hardcode and no 'one level of subdirectories' scan."
    - "A run with no `mypi-multi-agent.yaml` errors 'project not configured to run mypi-multi-agent'."
    - "This repo has `mypi-multi-agent.yaml` with `taskDirs: [mypi-tasks, .mypi]`, and `resolveSessionPath` still resolves this run's own `config-taskdirs` task via the `.mypi` entry (the run did not orphan itself)."
    - "`/mypi-multi-agent --init` creates `mypi-multi-agent.yaml` (default `taskDirs: [mypi-tasks]` plus a first-entry-writes comment) when absent, reports 'already configured' without overwriting when present, and drops a keys-only starter `task/session.yaml` (no values, comments per key) under `taskDirs[0]`."
    - "The run path creates no config, task directory, or `session.yaml`: a missing task name errors 'task '<name>' not found under taskDirs', and the old 'no session.yaml -> auto-scaffold' path is removed."
    - "`bun run test` exits 0; changed tests are red-first and reflect the new behavior; no existing behavior assertion is weakened."
    - "`bun run typecheck` exits 0; `biome check .` reports 0 errors; `fallow dead-code` reports 0 stale suppressions and at most 6 issues; `fallow health` reports a health score of 77 B or higher."
    - "GLOSSARY.md 'Task'/'Project root', README.md, docs/agent-config-guide.md §7, docs/architecture-handoff.md, and the '`.mypi` corpus' mentions in docs/pi-durable-fit.md and docs/landscape-and-positioning.md no longer claim the `.mypi/<task>/` layout or auto-scaffold; historical snapshots (docs/multi-agent-spec-v1.6.md, docs/run-inspection-ui-research.md, docs/architecture-diagram-alternatives/*) are untouched."

agents:
  - id: "implementer"
    title: "Config-taskdirs implementer"
    model: "deepseek/deepseek-v4-pro"
    permissions:
      read: true
      edit: true
      shell: true
    max_cost_usd: 4.00
    system_prompt: >-
      You own the config-driven taskDirs change and no other work. You are the
      single writer across shared/, src/pi/session-path.ts, src/pi/scaffold.ts,
      src/pi/extension.ts, templates/, docs, and the new root
      `mypi-multi-agent.yaml` — edit everything yourself, no two writers. Land
      tickets in dependency order (#56 parser, #57 resolution + this repo's
      config, #58 --init, #59 no-auto-scaffold, #60 docs) as one coherent change.
      Work test-first: write the failing test (paste the failure) before each
      behavior change; never weaken an existing assertion. The repo config you
      write MUST be `taskDirs: [mypi-tasks, .mypi]` so this run's own
      `.mypi/config-taskdirs/` session stays resolvable — never migrate, rename,
      or delete `.mypi/`. `mypi-tasks` must appear only as the generated default
      VALUE in config/template, never as a task-dir constant in code. The starter
      session template is keys-only (no values) with per-key comments, distinct
      from templates/session.yaml and templates/portable.yaml. Run `bun run
      test`, `bun run typecheck`, `biome check .`, `fallow dead-code`, and
      `fallow health` yourself before reporting; keep biome 0 errors, fallow
      dead-code at 0 stale suppressions and <= 6 issues, fallow health >= 77 B.
      End every report with one or two lines: what you did not do, and the risk.

  - id: "test_verifier"
    title: "Independent test verifier"
    model: "fireworks/accounts/fireworks/models/glm-5p3-flash"
    permissions:
      read: true
      edit: false
      shell: true
    shell_allowlist:
      - "bun run test"
      - "bun run typecheck"
      - "biome check ."
      - "fallow dead-code"
      - "fallow health"
    max_cost_usd: 0.60
    system_prompt: >-
      READ ONLY. Wait for an explicit verification work order AND for the
      implementer to have reported a code change; until then run nothing — if
      dispatched with no code change, report `TEST_VERIFIER FINAL: NOT-APPLICABLE
      (no code change)`. On a changed tree, run the full suite and the gates
      yourself and report an explicit line beginning `TEST_VERIFIER FINAL:`
      followed by GREEN or RED, with the exact commands and their real output.
      GREEN requires: `bun run test` exits 0, `bun run typecheck` clean, `biome
      check .` shows 0 errors, `fallow dead-code` shows 0 stale suppressions and
      at most 6 issues, and `fallow health` shows a health score of 77 B or
      higher. Any regression from those baselines is RED. Re-run after any fix.
      Do not edit, do not review style, do not attest the DoD — that is the
      reviewer's job. If a command is blocked, say so; never claim a run you did
      not execute.

  - id: "reviewer"
    title: "Independent final reviewer"
    model: "openai/gpt-6-luna"
    permissions:
      read: true
      edit: false
      shell: false
    max_cost_usd: 0.50
    system_prompt: >-
      READ ONLY. Reproduce each criterion byte-for-byte in your verdict block
      (backticks and punctuation included) exactly as the supervisor sent it, or
      the gate rejects the run. Start only after test_verifier reports GREEN. Read
      the actual code rather than trusting summaries. Attest each DoD criterion
      verbatim, one object each, with evidence citing function/symbol names —
      never line numbers. End your reply with a fenced JSON array of
      {"criterion","result":"pass"|"fail","evidence"}. A missing or failed
      criterion means failure. Reconcile the implementation against the ponytail
      ladder and return that reconciliation: what was built, what was deliberately
      NOT built, and every shortcut limit with its upgrade trigger. Attest the
      biome/fallow criterion from the verifier's reported output.

validation:
  commands:
    - "bun run test"
    - "bun run typecheck"
    - "biome check ."
