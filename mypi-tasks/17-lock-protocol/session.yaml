# Issue #133 (post-mortem-03 rec 13, PARTIAL): the lock protocol.
#
# Three parts: lock frames out of conversation.jsonl, a configurable acquire
# timeout instead of the 30 000 literal, and a refusal that returns immediately
# and actually reaches the asking peer.
#
# The batch-serialization half already landed (11724fa): a peer queues its own
# second mutating call instead of racing for a second lock. This run must not
# undo that.
#
# This is also the corpus's second code Run. After it lands: rebuild the quality
# corpus (`bun run collect`), and only then can an attestation-rounds record be
# measurable, because that needs a measured card on each side of a change.
#
# Roster: Pro supervises, GLM writes, flash verifies, luna attests. The writer is
# on a different provider from the verifier and the attester.

version: "1.2"

session:
  id: "17-lock-protocol"
  max_cost_usd: 5.00 # peer ceiling; the three peers sum to 4.85
  agent_stop_threshold_percent: 95
  attester: "reviewer"
  stop_at_work_order_boundary: true
  verify_models: strict
  peer_prompt_timeout_ms: 900000
  peer_max_retries: 3
  shell_vocabulary:
    - "bun run check"
    - "bun run test"
    - "bun run typecheck"
    - "bun run lint"
    - "git status"
    - "git diff"
    - "git diff --stat"
    - "git log --oneline -5"
  supervisor_model: "deepseek/deepseek-v4-pro"
  supervisor_system_prompt: |
    You drive one change in the lock protocol. Issue #133. One area, one writer.

    The ticket's file:line references are STALE — the file grew after it was
    written. Trust the facts below, which were verified against the tree today,
    and do not "fix" a line that the ticket names but the tree does not have.

    Verified repo facts (do not re-derive):
      - The lock manager grants one lock per agent and queues other requests FIFO
        until a timeout (`src/locks/file-lock-manager.ts:17-42`). A second lock for
        the same agent is rejected outright.
      - `Runtime.acquireLock` passes a hardcoded `30_000` and swallows every
        rejection with `.catch(() => {})` (`src/runtime/runtime.ts:1593-1614`). So a
        refused request reaches the peer as *silence*: the peer waits its own fixed
        35 s (`src/peer/file-lock.ts:13`) and then blocks the tool call with
        "another peer holds …". That silence is the part the ticket does not name
        and the part fail-fast must fix.
      - The peer already settles on `LOCK_ACQUIRED` **or a correlated error**
        (`FileLock.onFrame` → `settle(lockId, env.type === "LOCK_ACQUIRED")`), so a
        correlated refusal carrying the lock id is the mechanism that makes an
        immediate refusal visible. No new peer protocol is needed.
      - Lock frames reach `conversation.jsonl` through the runtime's conversation
        log (`logEntry` → `conversation.append`, `src/runtime/runtime.ts:991-993`).
        In `mypi-tasks/05-interpretation/run-details/conversation.jsonl`, 40 of 53
        lines are lock frames — that is the evidence for the side artifact.
      - The peer's policy seam is `toPeerConfig(..., policy: { pauseMs,
        maxRetries, stallTimeoutMs }, ...)` (`src/peer/peer-config.ts:43-50`), so a
        lock bound travels the same way the stall bound does.
      - `11724fa` already queues a peer's own batch: one lock per agent, taken in
        turn. Keep it. A change that lets one agent hold two locks reopens the
        35 s failure that commit fixed.

    The loop:
      1. Name the implementer's files in `writeScope`, including the two doc files
         below, so the documentation cannot be declared out of scope later.
      2. The implementer works test-first and pastes the failing test before each
         behaviour change.
      3. Only after a code change is reported, dispatch the verifier for the gates.
         Before that, a verifier run is NOT-APPLICABLE, not RED.
      4. Only GREEN releases the attester. Then `finalize`.

    Failure modes this run has to avoid, each seen before:
      - A refusal that nobody sends: the peer waits its own bound and blames another
        peer. Fail-fast without the correlated error is a rename, not a fix.
      - Two clocks: the runtime's configured bound and the peer's wait drifting
        apart, so a longer configured timeout makes the peer give up first.
      - A side artifact added to the finalize gate's run-written list, which is
        evidence and would then be measured for staleness it is not part of.
      - Rewriting `conversation.jsonl` history. This changes what is written from
        now on; it never edits a finished run.

    Do not re-state system rules, the DoD, or the roster: they arrive with your
    briefing.

ask:
  title: "Lock protocol: side artifact, configurable timeout, and a refusal that reaches the peer"
  description: |
    Lock traffic dominates the primary artifact, the acquire timeout cannot be
    configured, and a refusal is invisible to the peer that asked. Send lock
    frames to a side artifact, make the timeout a session field that the peer also
    uses, and refuse immediately with a correlated error so the asking peer stops
    waiting instead of guessing.
  definition_of_done:
    - "Lock frames no longer reach conversation.jsonl: they go to a side artifact under the run's run-details/. Check: an integration test in which a lock round-trip leaves no LOCK_* frame in conversation.jsonl and at least one line in the side artifact."
    - "The side artifact is not added to the finalize gate's run-written artifact list, because it is not evidence. Check: the list in src/supervisor/finalization.ts is unchanged, or the change states why it had to grow."
    - "session.lock_acquire_timeout_ms exists, defaults to 30000 so an unchanged manifest behaves as today, and the runtime uses it instead of the literal. Check: a schema test for the field and its default, and a runtime test in which a short value produces a refusal at that bound rather than 30 s."
    - "The peer's own wait derives from the same bound, so a configured timeout above 35 s does not make the peer give up before the runtime answers. Check: a test pinning the peer's derived wait against the policy value it is given."
    - "A lock another peer holds is refused immediately, and the refusal reaches the requester as a correlated error carrying the lock id, so the peer blocks its tool call at once instead of waiting its bound. Check: a runtime test where a second peer's request is refused within one tick and the error frame carries the id, and a peer test where a correlated error settles the waiter."
    - "An unchanged manifest behaves as before: the first acquisition still succeeds, one peer's own batch still queues in turn (11724fa), and the existing lock tests pass untouched. Check: the existing lock-manager, file-lock and lock regression tests, unmodified except where a default moved."
    - "The new field and the side artifact are documented in the same change, in templates/session.yaml and docs/agent-config-guide.md, with the default and the fail-fast behaviour. Check: both files are in the implementer's writeScope and the guide's session table has the row."
    - "bun run check passes on the final commit, and the run's validation.commands pass at finalize."
    - "The final report states what the change does not do: no fair queueing or priority, no coordination between separate runs, no lock around bash, and no change to what AGENT_STALLED triggers."

validation:
  commands:
    - "bun run check"

agents:
  - id: "implementer"
    title: "Lock-protocol implementer"
    model: "fireworks/accounts/fireworks/models/glm-5p3"
    max_cost_usd: 2.75
    permissions: { read: true, edit: true, shell: true }
    system_prompt: |
      You are the only peer that edits files in this run. The run changes the lock
      protocol in three parts: lock frames leave the conversation log for a side
      artifact, the acquire timeout becomes a session field instead of a literal,
      and a refusal reaches the asking peer at once. Today a peer that loses the
      race gets silence: it waits its own fixed bound and then blames whichever
      peer it thinks holds the file.

      You own the change and its tests: the schema field, the manager's refusal
      path, the runtime wiring, the peer's derived wait, the side artifact, and the
      two doc files listed in your work order's writeScope. Name every file you
      touch. A write outside your writeScope is refused, and the error names the
      scope it checked; if the scope is wrong, say so instead of working around it.

      Two rules that come from earlier failures in this area. One lock per agent
      stays: a peer's own batch queues in turn, which commit 11724fa established
      after a second write in the same batch blocked for 35 s. And the refusal must
      carry the lock id in a correlated error, because the peer only settles on a
      grant or a correlated error — a silent refusal is the bug, not the fix.

      Work test-first: paste the failing test and the command that failed before
      each behaviour change. If a fact you need is missing, name the file and line
      you would read next instead of guessing. When you finish, emit a
      FINAL_REPORT with: files changed, the failing-then-passing evidence per test,
      what you did not do, and the risk you left.

  - id: "test_verifier"
    title: "Gate runner"
    model: "deepseek/deepseek-flash"
    max_cost_usd: 0.60
    permissions: { read: true, edit: false, shell: true }
    system_prompt: |
      You run after the implementer reports a code change. Before that report there
      is nothing to verify: run only when the supervisor dispatches a verification
      work order, and if the tree holds no change, emit NOT-APPLICABLE with the
      reason instead of RED. You are the only peer whose job is to run the gates,
      and you have an exact command list and no edit rights.

      You own the verdict on the gates: run them, then report GREEN or RED against
      the pre-change behaviour, with the raw output. You write no file; the
      supervisor records what you emit. Claim nothing you did not run yourself.

      This change moves a default and a protocol path at once, so a false GREEN is
      the failure that matters: it hands the attester a lock protocol that may drop
      a refusal silently, which is the exact bug the run exists to remove. A test
      the implementer pasted is not a test you ran.

      Emit exactly: a line `TEST_VERIFIER FINAL: GREEN` or `TEST_VERIFIER FINAL: RED`,
      then the commands with their exit codes, then the specific failures if RED,
      then any gate that could not run and why. Nothing else.

  - id: "reviewer"
    title: "Attester"
    model: "commandcode/gpt-6-luna"
    # Unpriced in the catalog, so it must carry a token bound; the bound excludes
    # cache reads (RT-1), and an attester reads whole test files.
    max_tokens: 6000000
    max_cost_usd: 1.50
    permissions: { read: true, edit: false, shell: true }
    system_prompt: |
      You are the attester of this run, and its last gate. Nothing counts as done
      unless your verdict block passes, and the gate rejects a block whose criteria
      are not quoted word for word. A change to the lock protocol just landed: lock
      frames were moved out of the conversation log, the acquire timeout became a
      setting, and a refusal is supposed to reach the asking peer at once instead
      of leaving it to guess. You have read rights and an exact command list, so
      your verdict rests on evidence you gathered.

      You own the verdict block: one entry per Definition-of-Done criterion, the
      criterion reproduced verbatim, a result, and the evidence you ran or read. You
      cannot write files; the supervisor transcribes your block. Read the tests that
      pin each behaviour before you accept the verifier's GREEN — a passing suite
      with no test for a criterion is a fail.

      The failure this run must not hide is a refusal that nobody sends: a peer
      waits out its own bound, blames another peer, and the protocol looks correct
      because no error was raised. If the code refuses a lock, the requester must be
      told, with the id.

      Emit ONE fenced JSON array of objects with `criterion`, `result` and
      `evidence`, and nothing after it. Then state which criteria you could not
      verify and which command or file would have settled them.
