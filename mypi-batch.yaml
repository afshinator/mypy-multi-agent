# Batch policy — read by `mypi-batch prepare`, never written by it.
#
# This file is not a session config: `session.yaml` (the manifest) is generated per
# ticket from a template named below. See docs/batch-guide.md.
version: 1

prepare:
  # What the triage agent may answer as its KIND, injected into its prompt from this
  # list so renaming a template never edits a prompt.
  kinds: [code-fix, code-small, writer, writer-solo]
  kind_templates:
    code-fix: templates/batch-code-fix.yaml
    code-small: templates/code-small.yaml
    writer: templates/writer.yaml
    writer-solo: templates/writer-solo.yaml

  # The verifier must be a different model family from the author, or it shares the
  # author's blind spots (docs/explorations/triage-automation/triage-verifier.md).
  # commandcode gateway: same model, measured 3x cheaper (\$0.054 vs \$0.177 per triage)
  # and 3/3 completed where the native provider errored with a connection fault.
  triage_model: commandcode/deepseek/deepseek-v4-pro
  verifier_model: commandcode/gpt-6-luna
  # The one knob every prepare bound derives from: a full call's permit, a third of it for the
  # repair round, twice it as one ticket's prepare deadline. 15 is ~4x the measured p90 (3.6 min)
  # of the model that does triage; the shipped 30 was never measured against a call (#403).
  agent_timeout_minutes: 15

run:
  # Nothing in the runtime bounds a run; this driver's own clock is the only bound.
  timeout_minutes: 30
