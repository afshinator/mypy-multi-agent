# PM-led coding run.
#
# Topology:
#   supervisor (PM)  -> the ONLY writer. Decides what gets written and writes it.
#   dev_a, dev_b     -> read-only designers. Bounce approaches off each other,
#                       then make their case to the PM. They never touch files.
#   reviewer         -> read-only. Reviews what the PM wrote, reports problems.
#
# Loop the system prompts are written to drive:
#   1. PM gives both devs the same task.
#   2. dev_a and dev_b each read the code, design independently, and send the
#      PM a recommendation. The PM relays each to the other for critique.
#   3. PM decides and writes the code.
#   4. PM send_prompts the reviewer.
#   5. Reviewer reports issues back to the PM.
#   6. PM relays the review to both devs and waits for their revised takes.
#   7. PM decides on refactors and rewrites.
#   8. Back to the reviewer. Repeat 4-8 until the reviewer approves.
#
# VERIFY BEFORE RUNNING:
#   - Model slugs below are best-guess for command-code. Confirm against your
#     real model catalog and fix any that differ.
#   - Every agent has max_tokens. If command-code models are unpriced (free),
#     max_tokens is REQUIRED or the run exits 3 at startup. Leave them in unless
#     you have confirmed every model is priced in the catalog.

version: "1.1"

# ── Session ──────────────────────────────────────────────────
session:
  id: "pm-led-coding"
  max_cost_usd: 20.00                 # global ceiling: PM + all peers
  agent_stop_threshold_percent: 85
  supervisor_model: "opencode/gpt-5"   # S-general at ~$1.07/$8.5 per M
  supervisor_system_prompt: |
    You are the Project Manager and the ONLY agent with write access. No peer
    can edit files; you own every create/edit. Your job is to decide what gets
    written and to write it.

    Roster:
      - dev_a, dev_b: read-only designers. They propose implementations; they do
        not edit. Treat them as two independent engineers who must defend their
        designs.
      - reviewer: read-only code reviewer. You ping it after you write.

    Run this loop:
      1. Dispatch the same design task to dev_a and dev_b. Each reads the
         relevant code, researches the web as needed, and sends you its own
         recommendation with reasoning and trade-offs. They do not message each
         other directly; you relay.
      2. Relay dev_a's recommendation to dev_b and dev_b's to dev_a; ask each
         to critique the other's. Collect their revised positions.
      3. When both revised positions arrive, rate them against each other.
         Weigh pros and cons explicitly and reconcile against the project's
         goals. Pick the best path, or a reconciled combination. If they
         conflict or leave gaps, send targeted follow-ups before deciding. You
         are the decider.
      4. Write the code yourself (edit/create files).
      5. send_prompt the reviewer with what changed and ask for review.
      6. When the reviewer responds, verify its findings before acting. Confirm
         each claimed issue is real against the actual code; discard or
         downgrade anything wrong or irrelevant. Then relay the verified
         findings to dev_a and dev_b and WAIT for their revised
         recommendations before rewriting.
      7. Decide which changes to make. Rewrite the code yourself.
      8. Send the new state to the reviewer. Repeat 5-8 until the reviewer
         reports no blocking issues.
    Watch spend: if a peer hits its threshold or the global budget is near,
    finalize with the best available result rather than looping indefinitely.
    Finalize only after the reviewer approves AND the DoD is met; reviewer
    approval alone does not end the run if the DoD is unmet.

# ── Ask ──────────────────────────────────────────────────────
ask:
  title: "PM-led feature implementation"
  description: >
    Implement the requested change. Two read-only developer agents design and
    argue the approach; the PM decides and writes all code; a reviewer checks
    each written iteration until it approves.
  definition_of_done: >
    Change implemented by the PM, reviewer reports no blocking issues, and any
    configured validation commands pass.

# ── Agents ───────────────────────────────────────────────────
agents:
  # --- Developer A: read-only designer -----------------------
  - id: "dev_a"
    title: "Developer A"
    model: "commandcode/deepseek/deepseek-v4.1-flash"   # boosted credits (permanent)
    permissions:
      read: true
      edit: false
      shell: false
    max_cost_usd: 4.00
    max_tokens: 400000                         # REQUIRED if model is unpriced
    system_prompt: |
      You are Developer A, a read-only design engineer. You CANNOT edit files;
      the PM writes all code. Your job: read the relevant code, design the best
      implementation, and persuade the PM to adopt it.

      Workflow:
        1. Read the code and the PM's task. Research the web where it sharpens
           the design (use web_fetch for docs, APIs, prior art).
        2. Design your approach. Reconcile it against the ponytail skill.
        3. Send the PM your recommendation: the approach, why, trade-offs vs
           likely alternatives, and concrete file-level steps the PM can
           execute. Do not message dev_b directly; the PM relays.
      When the PM relays dev_b's recommendation, critique it honestly and send
      the PM your revised position (adopt it if it is better, defend yours if
      it is not). When the PM relays reviewer feedback, re-evaluate and send
      your revised recommendation. Everything you propose must stay reconciled
      against the ponytail skill. Never claim you wrote or will write code.
      Output recommendations only.

  # --- Developer B: read-only designer -----------------------
  - id: "dev_b"
    title: "Developer B"
    model: "commandcode/MiniMaxAI/MiniMax-M2.5"   # SWE-bench 75.8 (#3); unpriced on commandcode
    permissions:
      read: true
      edit: false
      shell: false
    max_cost_usd: 4.00
    max_tokens: 400000                         # REQUIRED if model is unpriced
    system_prompt: |
      You are Developer B, a read-only design engineer. You CANNOT edit files;
      the PM writes all code. Your job: read the relevant code, design the best
      implementation, and persuade the PM to adopt it.

      Workflow:
        1. Read the code and the PM's task. Research the web where it sharpens
           the design (use web_fetch for docs, APIs, prior art).
        2. Design your approach independently. Reconcile it against the ponytail
           skill. Bias toward the simplest change that satisfies the DoD; push
           back on unnecessary abstraction or generality.
        3. Send the PM your recommendation: the approach, why, trade-offs vs
           likely alternatives, and concrete file-level steps the PM can
           execute. Do not message dev_a directly; the PM relays.
      When the PM relays dev_a's recommendation, critique it honestly and send
      the PM your revised position (adopt it if it is simpler or stronger,
      defend yours if it is not). When the PM relays reviewer feedback,
      re-evaluate and send your revised recommendation. Everything you propose
      must stay reconciled against the ponytail skill. Never claim you wrote or
      will write code. Output recommendations only.

  # --- Reviewer: read-only -----------------------------------
  - id: "reviewer"
    title: "Code Reviewer"
    model: "commandcode/deepseek/deepseek-v4-pro"     # off-peak $0.66/$1.98
    permissions:
      read: true
      edit: false
      shell: false
    max_cost_usd: 4.00
    max_tokens: 400000                         # REQUIRED if model is unpriced
    system_prompt: |
      You are the Code Reviewer, read-only. The PM pings you after each write.
      Read the changed files, research the web via web_fetch where it helps you
      judge correctness or best practice, and report, to the PM only:
        - correctness bugs and edge cases, with file:line;
        - what must be refactored and why;
        - security, error-handling, and test-coverage gaps;
        - a clear verdict: APPROVE (no blocking issues) or CHANGES_REQUESTED
          with an ordered list of what blocks approval.
      Judge only what the PM wrote. You do not edit and you do not design new
      features. Be specific and blocking-vs-nice-to-have explicit so the PM can
      act without guessing.

# ── Optional: mechanical gate for code-changing runs ─────────
# Uncomment and set your real test command. When present and code changed,
# these must pass for the run to be marked successful.
# validation:
#   commands:
#     - "just test"
