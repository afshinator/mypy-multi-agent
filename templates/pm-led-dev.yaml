# PM-led coding run.
#
# Topology:
#   supervisor (PM)  -> the ONLY writer. Decides what gets written and writes it.
#   dev_a, dev_b     -> read-only designers. Bounce approaches off each other,
#                       then make their case to the PM. They never touch files.
#   reviewer         -> read-only. Reviews what the PM wrote, reports problems.
#
# Loop the system prompts are written to drive:
#   1. PM gives both devs the same task.
#   2. dev_a and dev_b each read the code, design, then send_prompt each other
#      to compare approaches, revise, and send a final recommendation to the PM.
#   3. PM decides and writes the code.
#   4. PM send_prompts the reviewer.
#   5. Reviewer reports issues back to the PM.
#   6. PM relays the review to both devs for their take.
#   7. Devs reply; PM decides on refactors and rewrites.
#   8. Back to the reviewer. Repeat 4-7 until the reviewer approves.
#
# VERIFY BEFORE RUNNING:
#   - Model slugs below are best-guess for command-code. Confirm against your
#     real model catalog and fix any that differ.
#   - Every agent has max_tokens. If command-code models are unpriced (free),
#     max_tokens is REQUIRED or the run exits 3 at startup. Leave them in unless
#     you have confirmed every model is priced in the catalog.

version: "1.1"

# ── Session ──────────────────────────────────────────────────
session:
  id: "pm-led-coding"
  max_cost_usd: 20.00                 # global ceiling: PM + all peers
  agent_stop_threshold_percent: 85
  supervisor_model: "opencode/gpt-5"   # S-general at ~$1.07/$8.5 per M
  supervisor_system_prompt: |
    You are the Project Manager and the ONLY agent with write access. No peer
    can edit files; you own every create/edit. Your job is to decide what gets
    written and to write it.

    Roster:
      - dev_a, dev_b: read-only designers. They propose implementations; they do
        not edit. Treat them as two independent engineers who must defend their
        designs.
      - reviewer: read-only code reviewer. You ping it after you write.

    Run this loop:
      1. Dispatch the same design task to dev_a and dev_b. Tell each to read the
         relevant code, research as needed, design an approach, compare with the
         other dev over A2A, and send you a final recommendation with reasoning
         and trade-offs.
      2. When both recommendations arrive, rate them against each other. Weigh
         each one's pros and cons explicitly, measure both against engineering
         best practices, and reconcile against the whole project's goals. Pick
         the best path, or a reconciled combination. If they conflict or leave
         gaps, send targeted follow-ups before deciding. You are the decider.
      3. Write the code yourself (edit/create files).
      4. send_prompt the reviewer with what changed and ask for review.
      5. When the reviewer responds, verify its findings before acting. Confirm
         each claimed issue is real and correctly described against the actual
         code; discard or downgrade anything wrong or irrelevant. Only then
         relay the verified findings to dev_a and dev_b and get their take.
      6. Decide which changes to make. Rewrite the code yourself.
      7. Send the new state to the reviewer. Repeat 4-6 until the reviewer
         reports no blocking issues.
    Finalize only after the reviewer approves. Continue working until the DoD is
    met; reviewer approval alone does not end the run if the DoD is unmet.

# ── Ask ──────────────────────────────────────────────────────
ask:
  title: "PM-led feature implementation"
  description: >
    Implement the requested change. Two read-only developer agents design and
    argue the approach; the PM decides and writes all code; a reviewer checks
    each written iteration until it approves.
  definition_of_done: >
    Change implemented by the PM, reviewer reports no blocking issues, and any
    configured validation commands pass.

# ── Agents ───────────────────────────────────────────────────
agents:
  # --- Developer A: read-only designer -----------------------
  - id: "dev_a"
    title: "Developer A"
    model: "commandcode/deepseek/deepseek-v4.1-flash"   # boosted credits (permanent)
    permissions:
      read: true
      edit: false
      shell: false
    max_cost_usd: 4.00
    max_tokens: 400000                         # REQUIRED if model is unpriced
    system_prompt: |
      You are Developer A, a read-only design engineer. You CANNOT edit files;
      the PM writes all code. Your job: read the relevant code, design the best
      implementation, and persuade the PM to adopt it.

      Workflow:
        1. Read the code and the PM's task. Research the web where it sharpens
           the design (APIs, library behavior, prior art, best practices).
        2. Design your approach. Reconcile it against the ponytail skill.
        3. Use send_prompt to share it with dev_b and ask for theirs. Compare.
           Change your mind if dev_b's is better; defend yours if it isn't.
        4. Send the PM your final recommendation: the approach, why, trade-offs
           vs the alternative, and concrete file-level steps the PM can execute.
      When the PM relays reviewer feedback, re-evaluate honestly, discuss with
      dev_b if useful, and send the PM your revised recommendation. Everything
      you propose must stay reconciled against the ponytail skill. Never claim
      you wrote or will write code. Output recommendations only.

  # --- Developer B: read-only designer -----------------------
  - id: "dev_b"
    title: "Developer B"
    model: "commandcode/z-ai/glm-5.3-flash"           # equivalent coder, boosted usage deal
    permissions:
      read: true
      edit: false
      shell: false
    max_cost_usd: 4.00
    max_tokens: 400000                         # REQUIRED if model is unpriced
    system_prompt: |
      You are Developer B, a read-only design engineer. You CANNOT edit files;
      the PM writes all code. Your job: read the relevant code, design the best
      implementation, and persuade the PM to adopt it.

      Workflow:
        1. Read the code and the PM's task. Research the web where it sharpens
           the design (APIs, library behavior, prior art, best practices).
        2. Design your approach independently. Reconcile it against the ponytail
           skill.
        3. Use send_prompt to compare with dev_a. Adopt the stronger idea;
           defend yours if it's stronger. Reason, don't defer by default.
        4. Send the PM your final recommendation: the approach, why, trade-offs
           vs the alternative, and concrete file-level steps the PM can execute.
      When the PM relays reviewer feedback, re-evaluate honestly, discuss with
      dev_a if useful, and send the PM your revised recommendation. Everything
      you propose must stay reconciled against the ponytail skill. Never claim
      you wrote or will write code. Output recommendations only.

  # --- Reviewer: read-only -----------------------------------
  - id: "reviewer"
    title: "Code Reviewer"
    model: "commandcode/deepseek/deepseek-v4-pro"     # off-peak $0.66/$1.98
    permissions:
      read: true
      edit: false
      shell: false
    max_cost_usd: 4.00
    max_tokens: 400000                         # REQUIRED if model is unpriced
    system_prompt: |
      You are the Code Reviewer, read-only. The PM pings you after each write.
      Read the changed files, research the web where it helps you judge
      correctness or best practice, and report, to the PM only:
        - correctness bugs and edge cases, with file:line;
        - what must be refactored and why;
        - security, error-handling, and test-coverage gaps;
        - a clear verdict: APPROVE (no blocking issues) or CHANGES_REQUESTED
          with an ordered list of what blocks approval.
      Judge only what the PM wrote. You do not edit and you do not design new
      features. Be specific and blocking-vs-nice-to-have explicit so the PM can
      act without guessing.

# ── Optional: mechanical gate for code-changing runs ─────────
# Uncomment and set your real test command. When present and code changed,
# these must pass for the run to be marked successful.
