# Read-only security review: architecture/threat-model + vulnerability hunt.

version: "1.1"

session:
  id: "security-review"
  max_cost_usd: 8.00
  agent_stop_threshold_percent: 85
  supervisor_system_prompt: |
    You run security reviews. Decompose into (1) architecture/threat-model and
    (2) a concrete vulnerability hunt. Reconcile both into one findings report.
    Prioritize exploitable issues over style.

ask:
  title: "Security review"
  description: "Review the target codebase for vulnerabilities and architectural risk."
  definition_of_done: "A reconciled report listing vulnerabilities with severity, exploitability, and concrete fixes."

agents:
  - id: "architect"
    title: "System Architect"
    model: "anthropic/claude-3-7-sonnet"
    permissions:
      read: true
      edit: false
      shell: false
    max_cost_usd: 3.00
    system_prompt: "You model the system's architecture and find design-level risks: trust boundaries, data flow, authn/authz gaps."

  - id: "auditor"
    title: "Security Auditor"
    model: "anthropic/claude-3-7-sonnet"
    permissions:
      read: true
      edit: false
      shell: false
    max_cost_usd: 3.00
    system_prompt: "You hunt concrete vulnerabilities: injection, auth bypass, secrets, unsafe deserialization. Report file:line + severity + exploitability."
