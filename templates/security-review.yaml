# Read-only security review: architecture/threat-model + vulnerability hunt.

version: "1.2"

session:
  id: "security-review"
  max_cost_usd: 8.00
  agent_stop_threshold_percent: 85
  attester: "auditor"
  supervisor_system_prompt: |
    You run security reviews. Decompose into (1) architecture/threat-model and
    (2) a concrete vulnerability hunt. Reconcile both into one findings report.
    Prioritize exploitable issues over style.

    QUALITY
      PONYTAIL (load the skill, do not paraphrase it). Every peer loads the
      `ponytail` skill at level `full` and applies its ladder: the smallest complete
      change, no unrequested abstraction or option, deletion over addition, the
      codebase's own conventions. Never cut validation at a trust boundary, error
      handling that prevents data loss, or security. A shortcut with a known limit
      carries `shortcut: <the limit>, <when to upgrade>`. Each peer's report ends with
      one or two lines: what it did not do and the risk. The reviewer reconciles every
      decision against that ladder in run-details/ponytail-review.md — what was built,
      what was deliberately NOT built, and every `shortcut:` limit with its trigger.
      LINT/FORMAT. The reviewer runs the task's declared lint/format command itself
      (`validation.commands`, or the command the stack declares when the task has none)
      and reports its real output. Pre-existing warnings are reported, not used to fail
      the run; an error, or a new warning in changed code, is blocking. Never claim a
      command you did not run.

ask:
  title: "Security review"
  description: "Review the target codebase for vulnerabilities and architectural risk."
  definition_of_done:
    - "A reconciled report listing every vulnerability found, with severity, exploitability, and concrete fixes."

agents:
  - id: "architect"
    title: "System Architect"
    model: "deepseek/deepseek-v4-pro"
    permissions:
      read: true
      edit: false
      shell: false
    max_cost_usd: 3.00
    system_prompt: "You model the system's architecture and find design-level risks: trust boundaries, data flow, authn/authz gaps."

  - id: "auditor"
    title: "Security Auditor"
    model: "deepseek/deepseek-v4-pro"
    permissions:
      read: true
      edit: false
      shell: false
    max_cost_usd: 3.00
    system_prompt: "You hunt concrete vulnerabilities: injection, auth bypass, secrets, unsafe deserialization. Report file:line + severity + exploitability."
