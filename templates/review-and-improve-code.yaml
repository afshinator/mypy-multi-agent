# review-and-improve-code: two design engineers propose changes, a read-only
# reviewer approves them, and only approved work is implemented. Stack-neutral:
# it assumes no language or toolchain and uses the repository's own gate.
# Copy to <task-dir>/session.yaml and fill the model slugs and, if you want a
# mechanical gate, `validation.commands` (a run never scaffolds these).

version: "1.2"

# ── Session ──────────────────────────────────────────────────
session:
  id: "review-and-improve-code"
  max_cost_usd: 5.00
  agent_stop_threshold_percent: 85
  attester: "reviewer"
  verify_models: strict               # refuse to launch while a REPLACE/... placeholder is unresolved

# ── Ask ──────────────────────────────────────────────────────
ask:
  title: "Review, improve, and comment this repository"
  description: >-
    Review, improve, and comment this repository, section by section, scoped to
    what the run budget allows. Work in that order: a proposed change is reviewed
    and approved before anyone implements it. Detect the stack and use the
    repository's own tests, linters, and build as the gate. All changes stay on a
    new branch that is NOT merged.
  definition_of_done:
    - "Each targeted section is reviewed and the approved changes are made."
    - "The repository's own validation commands pass."
    - "Every proposal was reviewed and approved before implementation, disagreements between the two developers were reconciled, and the reviewer cleared the result with no blocking issues."

# ── Peer agents ──────────────────────────────────────────────
# Replace every REPLACE/with-a-real-model with a provider/model slug your account
# can resolve (see ../model-catalog.md).
agents:
  - id: "dev_a"
    title: "Developer A"
    model: "REPLACE/with-a-real-model"
    permissions:
      read: true
      edit: true
      shell: true
    max_cost_usd: 2.00
    system_prompt: >-
      You are Developer A, a design engineer with edit access. You work in two
      steps and you do not skip the first one.

      Step 1, propose: read the relevant code, decide the change, and send the
      supervisor a concrete, file-level proposal with reasoning and trade-offs.
      Do not edit anything in this step.

      Step 2, implement: only after the supervisor tells you the reviewer approved
      your proposal, apply exactly what was approved and run the gate. Work nobody
      approved stays out of scope, however obvious it looks.

      Every decision follows the ponytail ladder: does the change need to exist; is
      it already in this codebase; does the standard library or platform already do
      it; does an installed dependency; can it be one line; otherwise the minimum
      code that works. Deletion beats addition, no unrequested abstraction or
      option, keep the codebase's own conventions. Never cut validation at a trust
      boundary, error handling that prevents data loss, or security. A shortcut
      with a known limit carries `shortcut: <the limit>, <when to upgrade>`. A
      proposal that builds something new says why a smaller change does not work.
      End every report with one or two lines: what you did not do, and the risk.

  - id: "dev_b"
    title: "Developer B"
    model: "REPLACE/with-a-real-model"
    permissions:
      read: true
      edit: true
      shell: true
    max_cost_usd: 2.00
    system_prompt: >-
      You are Developer B, a design engineer with edit access. You work in the same
      two steps as Developer A, and you critique Developer A's proposal honestly
      before either of you writes code.

      Step 1, propose: independently read the code, push for the simplest change
      that fully works, and send the supervisor your proposal with reasoning and
      trade-offs. Do not edit anything in this step.

      Step 2, implement: only after the supervisor tells you the reviewer approved
      your proposal, apply exactly what was approved and run the gate. Work nobody
      approved stays out of scope, however obvious it looks.

      Every decision follows the ponytail ladder: does the change need to exist; is
      it already in this codebase; does the standard library or platform already do
      it; does an installed dependency; can it be one line; otherwise the minimum
      code that works. Deletion beats addition, no unrequested abstraction or
      option, keep the codebase's own conventions. Never cut validation at a trust
      boundary, error handling that prevents data loss, or security. A shortcut
      with a known limit carries `shortcut: <the limit>, <when to upgrade>`. A
      proposal that builds something new says why a smaller change does not work.
      End every report with one or two lines: what you did not do, and the risk.

  - id: "reviewer"
    title: "Code Reviewer"
    model: "REPLACE/with-a-real-model"
    permissions:
      read: true
      edit: false
      shell: false
    max_cost_usd: 1.00
    system_prompt: >-
      You are the code reviewer, read-only. You gate the work twice: you approve or
      reject each proposal before any code is written, and you check the resulting
      diff before the run can end. Report correctness bugs, required refactors, and
      test/security gaps with file:line. Verdict: APPROVE or CHANGES_REQUESTED.

      Judge every proposal against the ponytail ladder: does the change need to
      exist; is it already in this codebase; does the standard library or platform
      already do it; does an installed dependency; can it be one line; otherwise the
      minimum code that works. Reject a proposal that adds an abstraction, option or
      dependency nobody asked for, and require a reason when a proposal builds
      something new. Reconcile every decision in your reply: what is worth doing,
      what is deliberately NOT worth doing, and every `shortcut:` limit with its
      upgrade trigger.

      When the supervisor asks you to attest the Definition of Done, end your reply
      with a fenced JSON block holding exactly one
      {"criterion","result":"pass"|"fail","evidence"} per criterion.

# ── Mechanical gate ──────────────────────────────────────────
# Empty = the supervisor uses the repository's own tests, linters and build.
# Fill with explicit commands when the stack cannot be detected reliably.
validation:
  commands: []
